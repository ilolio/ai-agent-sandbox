# プロジェクトごとに別コンテナとして起動する。
# 使い方:
#   PROJECT=myapp WORKSPACE=/path/to/myapp docker compose -p myapp up -d
#   docker compose -p myapp exec agent claude
#
# -p (project name) を変えれば同じ compose で複数プロジェクトが並走する。
# それぞれ独立したコンテナ・ネットワーク・ワークスペースになる。

services:
  agent:
    build:
      context: .
      # ★言語(flavor)の選択。project-configs/<project>.env の FLAVOR で切り替わる。
      target: ${FLAVOR:-node}
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    # flavor ごとに別イメージにする（同タグだと flavor が互いに上書きしてしまう）
    image: ai-agent-sandbox:${FLAVOR:-node}
    container_name: ${PROJECT:-default}-agent

    # iptables を張るために必要な最小権限
    cap_add:
      - NET_ADMIN
      - NET_RAW

    # ★ファイルのやり取りはこの 1 フォルダだけ。
    #   host の WORKSPACE を /workspace に bind mount する。
    volumes:
      - ${WORKSPACE:?set WORKSPACE to the project folder}:/workspace:rw
      # Claude Code の設定/履歴はプロジェクト別に永続化（host を汚さない）
      - claude-config:/home/node/.claude
      # 実行時に入れたツール（pip --user, uv tool, npm i -g, go install 等）の置き場。
      # ここに無いものはコンテナ再作成で消える。
      # OpenCode のセッション/履歴(~/.local/share/opencode)もここに入る。
      - local-tools:/home/node/.local
      # OpenCode の設定。opencode.json 自体は毎起動 entrypoint が作り直すが、
      # 実行時に npm から取るプロバイダ SDK(node_modules)が同じ場所に落ちるので、
      # 永続化しておくとコンテナ再作成のたびに registry.npmjs.org を叩かずに済む。
      - opencode-config:/home/node/.config/opencode

    environment:
      LLAMA_HOST: ${LLAMA_HOST:-host.docker.internal}
      LLAMA_PORT: ${LLAMA_PORT:-8080}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-local-model}
      # Claude Code に伝えるモデルの context/output 上限（llama-server の実際の
      # --ctx-size に合わせる）。entrypoint が settings.json に書く。
      CLAUDE_CTX: ${CLAUDE_CTX:-131072}
      CLAUDE_OUT: ${CLAUDE_OUT:-32000}
      # ★既定のエージェント（claude | opencode）。CLI は両方入っているので
      #   ./agent.sh <p> claude / opencode で都度上書きできる。
      AGENT: ${AGENT:-claude}
      # OpenCode 用。空なら CLAUDE_MODEL を使う。
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      # OpenCode に伝えるモデルの context/output 上限（llama-server の実際の
      # --ctx-size に合わせる。大きすぎるとサーバ側でエラーになる）
      OPENCODE_CTX: ${OPENCODE_CTX:-131072}
      OPENCODE_OUT: ${OPENCODE_OUT:-32000}
      # OpenCode 内部の 32k クランプを外す実験的フラグ（空なら 32000 のまま）。
      # 詳細は env.example 参照。
      OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX: ${OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX:-}
      # ★コンテナ（プロジェクト）ごとに違うホワイトリスト
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-}
      ENABLE_FIREWALL: ${ENABLE_FIREWALL:-1}

    # Linux で host.docker.internal を使えるようにする
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # entrypoint が firewall と設定生成を終えると /tmp/.sandbox-ready を作る。
    # agent.sh はこれが healthy になるまで exec を待つ（起動直後に
    # firewall 未設定のままエージェントを走らせないため）。
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/.sandbox-ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

    working_dir: /workspace
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  claude-config:
  local-tools:
  opencode-config:
